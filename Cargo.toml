[workspace]
resolver = "2"
members = ["crates/money", "crates/schema", "crates/legal", "crates/app", "crates/annuaire", "crates/web", "crates/auth", "crates/db", "crates/pdf", "crates/cli", "crates/mcp", "crates/mail", "crates/sepa", "crates/greffons", "crates/greffon-exemple", "crates/mrp", "crates/pos", "crates/i18n", "crates/recurrence", "crates/comptabilite", "crates/facturx", "crates/einvoicing"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Client HTTP : les notifications et l'annuaire, sans intermediaire.
ureq = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# Les symboles de debogage complets pesent lourd : 24 Go de `.pdb` accumules en
# une session, parce que chaque build laisse les siens et que rien ne les
# efface. `line-tables-only` garde ce qui sert vraiment — un arret sur une ligne
# avec son fichier — sans embarquer les variables locales de chaque fonction.
# Une trace reste lisible ; le disque respire.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.metadata]
licence = "GPL-3.0-or-later"
oeuvre-derivee = "Dolibarr ERP & CRM 24.0.1 (GPL-3.0-or-later)"
attribution = "Voir MENTIONS-LEGALES.md"
