[workspace]
resolver = "2"
members = ["crates/money", "crates/schema", "crates/legal", "crates/app", "crates/annuaire", "crates/web", "crates/auth", "crates/db", "crates/pdf", "crates/cli", "crates/mcp", "crates/mail", "crates/sepa", "crates/greffons", "crates/greffon-exemple", "crates/mrp", "crates/devises", "crates/pos", "crates/paie"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
[workspace.metadata]
licence = "GPL-3.0-or-later"
oeuvre-derivee = "Dolibarr ERP & CRM 24.0.1 (GPL-3.0-or-later)"
attribution = "Voir MENTIONS-LEGALES.md"
